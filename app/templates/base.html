<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="North Fork Marketing — all of your marketing needs. We work with local businesses on the north fork and beyond to help grow their online presence.">
    <title>{% block title %}North Fork Marketing{% endblock %}</title>
    <link rel="preload" href="{{ url_for('static', path='/fonts/bebas-neue.ttf') }}" as="font" type="font/ttf" crossorigin>
    <link rel="stylesheet" href="{{ url_for('static', path='/css/styles.css') }}">
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
      <a class="wordmark" href="/" aria-label="North Fork Marketing home">
        <img src="{{ url_for('static', path='/images/north-fork-marketing-logo.png') }}" alt="North Fork Marketing" width="2000" height="2000" fetchpriority="high">
      </a>
      <nav class="navigation" aria-label="Main navigation">
        <a href="/"{% if request.url.path == '/' %} class="active" aria-current="page"{% endif %}>HOME</a>
        <a href="/about"{% if request.url.path == '/about' %} class="active" aria-current="page"{% endif %}>ABOUT</a>
        <a href="/clients"{% if request.url.path == "/clients" %} class="active" aria-current="page"{% endif %}>CLIENTS</a>
        <a href="/contact"{% if request.url.path == '/contact' %} class="active" aria-current="page"{% endif %}>CONTACT</a>
        <div class="social-links">
          <a class="social-icon" href="https://www.instagram.com/nofomarketing/" target="_blank" rel="noopener noreferrer" aria-label="North Fork Marketing on Instagram (opens in a new tab)">
            <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="3" width="26" height="26" rx="7" fill="none" stroke="currentColor" stroke-width="2.8"/><circle cx="16" cy="16" r="6" fill="none" stroke="currentColor" stroke-width="2.8"/><circle cx="24" cy="8.5" r="1.8" fill="currentColor"/></svg>
          </a>
          <a class="social-icon" href="https://www.tiktok.com/@nofomarketing" target="_blank" rel="noopener noreferrer" aria-label="North Fork Marketing on TikTok (opens in a new tab)">
            <svg viewBox="0 0 32 32" aria-hidden="true"><defs><path id="tiktok-note" d="M18 3h5c.5 4 2.5 6 6 6v5c-2.4 0-4.4-.7-6-1.8V23a8 8 0 1 1-8-8v5a3 3 0 1 0 3 3Z"/></defs><use href="#tiktok-note" fill="#25f4ee" transform="translate(-1 1)"/><use href="#tiktok-note" fill="#fe2c55" transform="translate(1 0)"/><use href="#tiktok-note" fill="currentColor"/></svg>
          </a>
        </div>
      </nav>
    </header>
    {% block content %}{% endblock %}
    <footer class="site-footer">
      <div class="footer-inner">
        <a class="wordmark footer-logo" href="/" aria-label="North Fork Marketing home">
          <img src="{{ url_for('static', path='/images/north-fork-marketing-logo.png') }}" alt="North Fork Marketing" width="2000" height="2000" loading="lazy">
        </a>
        <div class="footer-links">
          <nav aria-label="Footer navigation">
            <a href="/">Home</a><a href="/about">About</a><a href="/clients">Clients</a><a href="/contact">Contact</a>
          </nav>
          <p>North Fork Marketing &copy; {{ current_year }}</p>
        </div>
        <div class="footer-contact">
          <a href="tel:+16319059595">(631) 905-9595</a>
          <a href="mailto:northforkmarketing@gmail.com">northforkmarketing@gmail.com</a>
          <div class="footer-socials">
            <a href="https://www.instagram.com/nofomarketing/" target="_blank" rel="noopener noreferrer" aria-label="Instagram (opens in a new tab)">Instagram ↗</a>
            <a href="https://www.tiktok.com/@nofomarketing" target="_blank" rel="noopener noreferrer" aria-label="TikTok (opens in a new tab)">TikTok ↗</a>
          </div>
        </div>
      </div>
    </footer>
  </body>
</html>
